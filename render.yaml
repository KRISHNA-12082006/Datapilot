# DataPilot — Render Blueprint (one-click deploy: Web Service + Postgres)
# Dashboard -> New + -> Blueprint -> point at this repo.
# Verified against Render's blueprint spec + render-examples/remix-postgres:
# services use `env: node` (not `runtime:`), DB wiring uses
# fromDatabase { name, property: connectionString }.

services:
  - type: web
    name: datapilot
    env: node
    branch: main
    plan: free # bump to starter for no-sleep + more RAM
    buildCommand: npm ci && npm run build
    startCommand: npm start
    preDeployCommand: npm run db:init # idempotent: creates tables + seeds connectors
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: 22.14.0
      - key: DATABASE_URL
        fromDatabase:
          name: datapilot-db
          property: connectionString # internal URL, same region
      - key: NEXT_PUBLIC_APP_URL
        value: https://datapilot.onrender.com # edit to your real service URL, then redeploy
      - key: AI_API_KEY
        sync: false # prompts for a secret at Blueprint apply time (optional)

databases:
  - name: datapilot-db
    plan: free
